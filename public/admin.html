
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | JABIÑAR FOOD STORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f3fb;
      color: #282238;
    }

    header {
      background: #5634a5;
      color: white;
      padding: 20px;
    }

    header .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    button, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header-button {
      border: 1px solid #ffffff80;
      border-radius: 9px;
      padding: 10px 14px;
      background: transparent;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 14px 30px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar select,
    .toolbar button {
      border: 1px solid #ddd4ef;
      border-radius: 9px;
      padding: 11px;
      background: white;
      color: #5634a5;
    }

    #message {
      margin-bottom: 14px;
      color: #5634a5;
      overflow-wrap: anywhere;
    }

    .order-card {
      background: white;
      border: 1px solid #e7e0f1;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px #33204a0a;
    }

    .order-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee8f6;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .order-heading h2 {
      margin: 0;
      color: #5634a5;
      font-size: 19px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      background: #f1ebff;
      color: #5634a5;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .detail {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .detail strong {
      display: block;
      font-size: 12px;
      color: #777184;
      margin-bottom: 4px;
    }

    .items {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee8f6;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0edf5;
    }

    .total {
      text-align: right;
      color: #5634a5;
      font-size: 20px;
      font-weight: bold;
      margin-top: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .actions select {
      min-width: 150px;
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd4ef;
      border-radius: 9px;
      background: white;
    }

    .action-button {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      background: #5634a5;
      color: white;
    }

    .action-button:disabled,
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .paid-button {
      background: #167647;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 28px;
      border-radius: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 19px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .order-card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <div>
        <h1>JABIÑAR FOOD STORE</h1>
        <p>Admin Dashboard — Order Management</p>
      </div>

      <button class="header-button" id="storeButton">
        Back to Store
      </button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <select id="statusFilter" aria-label="Filter orders by status">
        <option value="ALL">All Orders</option>
        <option value="PENDING">Pending</option>
        <option value="PROCESSING">Processing</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>

      <button id="refreshButton">Refresh Orders</button>
    </div>

    <p id="message" role="status">
      Checking admin access...
    </p>

    <section id="ordersList" aria-live="polite"></section>
  </main>
  
<script>
"use strict";

const $ = (selector) => document.querySelector(selector);

const message = $("#message");
const ordersList = $("#ordersList");
const statusFilter = $("#statusFilter");
const refreshButton = $("#refreshButton");

let allOrders = [];

async function apiRequest(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.success === false) {
    throw new Error(data.message || "Request failed.");
  }

  return data;
}

function money(value) {
  return "₱" + Number(value || 0).toLocaleString("en-PH", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function addDetail(container, label, value) {
  const detail = document.createElement("div");
  detail.className = "detail";

  const title = document.createElement("strong");
  title.textContent = label;

  const text = document.createElement("span");
  text.textContent =
    value === null || value === undefined || value === ""
      ? "Not provided"
      : String(value);

  detail.append(title, text);
  container.appendChild(detail);
}


async function checkAdmin() {
  try {
    const data = await apiRequest("/api/auth/me");
    const user = data.user;

    const isAdmin =
      user &&
      (
        user.is_admin === true ||
        user.is_admin === 1 ||
        user.is_admin === "true"
      );

    if (!isAdmin) {
      message.textContent =
        "Admin access required. Please use your administrator account.";

      ordersList.replaceChildren();
      return false;
    }

    message.textContent = "Welcome, administrator.";
    return true;
  } catch (error) {
    message.textContent =
      "Unable to verify admin access: " +
      (error.message || "Please log in again.");

    ordersList.replaceChildren();
    return false;
  }
}

  
async function loadOrders() {
  refreshButton.disabled = true;
  message.textContent = "Loading orders...";

  try {
    const data = await apiRequest("/api/admin/orders");

    allOrders = Array.isArray(data.orders)
      ? data.orders
      : [];

    renderOrders();

    message.textContent =
      `Loaded ${allOrders.length} order(s).`;
  } catch (error) {
    message.textContent =
      "Could not load orders: " + error.message;
    ordersList.replaceChildren();
  } finally {
    refreshButton.disabled = false;
  }
}
  
function renderOrders() {
  ordersList.replaceChildren();

  const selectedStatus = statusFilter.value;

  const orders = allOrders.filter((order) => {
    return selectedStatus === "ALL" ||
      String(order.order_status).toUpperCase() === selectedStatus;
  });

  if (!orders.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No orders found.";
    ordersList.appendChild(empty);
    return;
  }

  orders.forEach((order) => {
    const card = document.createElement("article");
    card.className = "order-card";

    const heading = document.createElement("div");
    heading.className = "order-heading";

    const title = document.createElement("h2");
    title.textContent = "Order #" + order.id;

    const status = document.createElement("span");
    status.className = "status";
    status.textContent = order.order_status || "PENDING";

    heading.append(title, status);
    card.appendChild(heading);

    const details = document.createElement("div");
    details.className = "details";

    addDetail(details, "Customer", order.full_name || order.username);
    addDetail(details, "Username", order.username);
    addDetail(details, "Contact Number", order.contact_number);
    addDetail(details, "Delivery Address", order.delivery_address);
    addDetail(details, "Instructions", order.delivery_instructions);
    addDetail(details, "Payment Method", order.payment_method);
    addDetail(details, "Payment Status", order.payment_status);
    addDetail(
      details,
      "Order Date",
      order.created_at
        ? new Date(order.created_at).toLocaleString()
        : "Not available"
    );

    card.appendChild(details);

    const itemsBox = document.createElement("div");
    itemsBox.className = "items";

    const itemsTitle = document.createElement("strong");
    itemsTitle.textContent = "Ordered Items";
    itemsBox.appendChild(itemsTitle);

    const items = Array.isArray(order.items) ? order.items : [];

    if (!items.length) {
      const noItems = document.createElement("p");
      noItems.textContent = "No item details available.";
      itemsBox.appendChild(noItems);
    }

    items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "item-row";

      const name = document.createElement("span");
      name.textContent =
        `${item.product_name || item.name || "Product"} × ${item.quantity}`;

      const subtotal = document.createElement("strong");
      subtotal.textContent = money(
        item.subtotal ?? Number(item.price || 0) * Number(item.quantity || 0)
      );

      row.append(name, subtotal);
      itemsBox.appendChild(row);
    });

    card.appendChild(itemsBox);

    const total = document.createElement("div");
    total.className = "total";
    total.textContent = "Total: " + money(order.total_amount);
    card.appendChild(total);

    const actions = document.createElement("div");
    actions.className = "actions";

    const statusSelect = document.createElement("select");
    statusSelect.setAttribute("aria-label", "Change order status");

    ["PENDING", "PROCESSING", "COMPLETED", "CANCELLED"].forEach((value) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      statusSelect.appendChild(option);
    });

    statusSelect.value = ["PENDING", "PROCESSING", "COMPLETED", "CANCELLED"]
      .includes(String(order.order_status).toUpperCase())
      ? String(order.order_status).toUpperCase()
      : "PENDING";

    const updateButton = document.createElement("button");
    updateButton.className = "action-button";
    updateButton.textContent = "Update Status";

    updateButton.addEventListener("click", async () => {
      const newStatus = statusSelect.value;

      if (newStatus === order.order_status) {
        message.textContent = "The status has not changed.";
        return;
      }

      if (!confirm(`Change order #${order.id} to ${newStatus}?`)) {
        return;
      }

      updateButton.disabled = true;

      try {
        await apiRequest(`/api/admin/orders/${order.id}/status`, {
          method: "PATCH",
          body: JSON.stringify({ status: newStatus })
        });

        message.textContent = `Order #${order.id} updated.`;
        await loadOrders();
      } catch (error) {
        message.textContent = "Update failed: " + error.message;
      } finally {
        updateButton.disabled = false;
      }
    });

    actions.append(statusSelect, updateButton);

    
    if (
      String(order.payment_method).toUpperCase() === "COD" &&
      String(order.payment_status).toUpperCase() !== "PAID"
    ) {
      const paidButton = document.createElement("button");
      paidButton.className = "action-button paid-button";
      paidButton.textContent = "Confirm COD Received";

      paidButton.addEventListener("click", async () => {
        if (!confirm(
          `Confirm cash was received for order #${order.id}?`
        )) return;

        paidButton.disabled = true;

        try {
          await apiRequest(
            `/api/admin/orders/${order.id}/cod-payment`,
            { method: "PATCH" }
          );

          message.textContent =
            `COD payment for order #${order.id} marked as paid.`;

          await loadOrders();
        } catch (error) {
          message.textContent =
            "Payment update failed: " + error.message;
        } finally {
          paidButton.disabled = false;
        }
      });

      actions.appendChild(paidButton);
    }

    // Delete Order button for admin
    const deleteButton = document.createElement("button");
    deleteButton.className = "action-button";
    deleteButton.textContent = "Delete Order";
    deleteButton.style.background = "#b42335";
    deleteButton.style.color = "#fff";

    deleteButton.addEventListener("click", async () => {
      const confirmed = confirm(
        `Permanently delete Order #${order.id}? This cannot be undone.`
      );

      if (!confirmed) return;

      deleteButton.disabled = true;
      deleteButton.textContent = "Deleting...";

      try {
        await apiRequest(
          `/api/admin/orders/${encodeURIComponent(order.id)}`,
          { method: "DELETE" }
        );

        message.textContent =
          `Order #${order.id} deleted successfully.`;

        await loadOrders();
      } catch (error) {
        message.textContent =
          "Delete failed: " + error.message;
      } finally {
        deleteButton.disabled = false;
        deleteButton.textContent = "Delete Order";
      }
    });

    actions.appendChild(deleteButton);

    card.appendChild(actions);
    ordersList.appendChild(card);
  });
}
  refreshButton.addEventListener("click", loadOrders);
statusFilter.addEventListener("change", renderOrders);

$("#storeButton").addEventListener("click", () => {
  window.location.href = "/";
});
  }  
(async function initializeAdminDashboard() {
  const isAdmin = await checkAdmin();

  if (isAdmin) {
    await loadOrders();
  }
})();


(async function initAdmin() {
  const allowed = await checkAdmin();

  if (allowed) {
    await loadOrders();
  }
})();
</script>
</body>
</html>
