
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hosting UI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h2>My Hosting UI</h2>
    <span class="status">● Server Dashboard</span>
  </header>

  <main class="container">
    <section class="welcome">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Your Hosting Dashboard</h1>
      <p>Manage your website and check your server connection.</p>
    </section>

    <section class="card">
      <h3>Server Status</h3>
      <p id="serverStatus">Checking connection...</p>
      <button id="checkButton">Check Server</button>
    </section>

    <section class="card">
      <h3>Database Status</h3>
      <p id="dbStatus">Database connection not configured yet.</p>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
