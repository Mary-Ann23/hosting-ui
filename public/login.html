
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JABIÑAR FOOD STORE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #302344;
  background:
    linear-gradient(
      135deg,
      rgba(77, 22, 135, .75),
      rgba(139, 92, 246, .55)
    ),
    url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1600&q=80")
    center / cover fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-wrapper {
  width: 100%;
  max-width: 420px;
}

.brand {
  text-align: center;
  margin-bottom: 24px;
  color: white;
}

.brand-logo {
  width: 70px;
  height: 70px;
  border-radius: 22px;
  margin: 0 auto 12px;
  background: linear-gradient(135deg, #a855f7, #6d28d9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  font-weight: 900;
  box-shadow: 0 8px 25px #2e075766;
}

.brand h1 {
  font-family: "Trebuchet MS", sans-serif;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 0 3px 12px #32104c99;
}

.brand p {
  font-size: 14px;
  color: #fff0ff;
}

.login-card {
  background: rgba(255, 255, 255, .97);
  border: 1px solid white;
  border-radius: 24px;
  padding: 28px 24px;
  box-shadow: 0 18px 50px #240b3d66;
}

.tabs {
  display: flex;
  gap: 8px;
  background: #f5f0fc;
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  border: none;
  padding: 12px 8px;
  border-radius: 9px;
  background: transparent;
  color: #78688c;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: white;
  color: #7c3aed;
  box-shadow: 0 2px 8px #4c287710;
}

.form-title {
  font-size: 23px;
  margin-bottom: 7px;
  color: #57218a;
}

.form-description {
  color: #887a98;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  padding: 14px;
  border: 1px solid #e5dced;
  border-radius: 12px;
  outline: none;
  background: white;
  font-size: 14px;
  color: #302344;
}

.field input:focus {
  border-color: #9b70ef;
  box-shadow: 0 0 0 3px #9b70ef25;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 68px;
}

.show-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #7c3aed;
  font-weight: bold;
  cursor: pointer;
  padding: 5px;
}

.submit-btn {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 12px;
  color: white;
  background: linear-gradient(135deg, #8b5cf6, #7c3aed, #a855f7);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.submit-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 16px;
}

.message.error {
  display: block;
  background: #fff0f0;
  color: #b42318;
}

.message.success {
  display: block;
  background: #ecfdf3;
  color: #087443;
}

.footer-text {
  text-align: center;
  font-size: 12px;
  color: white;
  margin-top: 22px;
  line-height: 1.7;
  text-shadow: 0 2px 8px #32104c99;
}

.hidden {
  display: none !important;
}

@media (max-width: 380px) {
  .login-card {
    padding: 23px 18px;
  }

  .brand h1 {
    font-size: 22px;
  }

  body {
    background-attachment: scroll;
  }
}
</style>

</head>

<body>
  <main class="login-wrapper">
    <header class="brand">
      <div class="brand-logo">JF</div>
      <h1>JABIÑAR FOOD STORE</h1>
      <p>Good food, happy mood. 💜</p>
    </header>

    <section class="login-card">
      <div class="tabs">
        <button type="button" class="tab active" id="loginTab">
          Log in
        </button>
        <button type="button" class="tab" id="registerTab">
          Create Account
        </button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <h2 class="form-title">Welcome back!</h2>
        <p class="form-description">
          Log in to order your favorite food.
        </p>

        <div class="field">
          <label for="loginUsername">Username</label>
          <input
            type="text"
            id="loginUsername"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="show-password"
              data-toggle="loginPassword"
            >Show</button>
          </div>
        </div>

        <button class="submit-btn" type="submit" id="loginButton">
          Log in
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="hidden">
        <h2 class="form-title">Create your account</h2>
        <p class="form-description">
          Join us and enjoy ordering your favorite food.
        </p>

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="full_name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="registerUsername">Username</label>
          <input
            type="text"
            id="registerUsername"
            name="username"
            placeholder="Choose a username"
            autocomplete="username"
            minlength="3"
            required
          >
        </div>

        <div class="field">
          <label for="registerPassword">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="registerPassword"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button
              type="button"
              class="show-password"
              data-toggle="registerPassword"
            >Show</button>
          </div>
        </div>

        <button class="submit-btn" type="submit" id="registerButton">
          Create Account
        </button>
      </form>
    </section>

    <p class="footer-text">
      © 2026 JABIÑAR FOOD STORE<br>
      Fresh food, friendly service.
    </p>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    loginTab.addEventListener("click", () => {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      clearMessage();
    });

    registerTab.addEventListener("click", () => {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      clearMessage();
    });

    document.querySelectorAll("[data-toggle]").forEach(button => {
      button.addEventListener("click", () => {
        const field = document.getElementById(button.dataset.toggle);
        const isHidden = field.type === "password";

        field.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
      });
    });

    async function sendRequest(url, form) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(
          Object.fromEntries(new FormData(form).entries())
        )
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request failed. Please try again.");
      }

      return data;
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const button = document.getElementById("loginButton");
      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const data = await sendRequest("/api/auth/login", loginForm);

        if (!data.user) {
          throw new Error("The server did not return a user account.");
        }

        showMessage("Login successful! Opening your store...", "success");

        window.location.replace("/");
      } catch (error) {
        showMessage(
          error.message === "Failed to fetch"
            ? "Cannot connect to the server. Please check your internet connection."
            : error.message
        );
      } finally {
        button.disabled = false;
        button.textContent = "Log in";
      }
    });

    registerForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const button = document.getElementById("registerButton");
      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        await sendRequest("/api/auth/register", registerForm);

        showMessage(
          "Account created! You can now log in.",
          "success"
        );

        registerForm.reset();
        loginForm.reset();
        loginTab.click();
      } catch (error) {
        showMessage(
          error.message === "Failed to fetch"
            ? "Cannot connect to the server. Please check your internet connection."
            : error.message
        );
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
  </html>
